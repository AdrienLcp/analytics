<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />
    <!-- The page's ground in each palette: if `--ground` moves, these move with it. -->
    <meta content="#f5f4f6" media="(prefers-color-scheme: light)" name="theme-color" />
    <meta content="#141516" media="(prefers-color-scheme: dark)" name="theme-color" />
    <link href="/favicon.svg" rel="icon" type="image/svg+xml" />
    <link href="/apple-touch-icon.png" rel="apple-touch-icon" />
    <link as="font" crossorigin href="/fonts/familjen-grotesk-latin.woff2" rel="preload" type="font/woff2" />
    <link as="font" crossorigin href="/fonts/geist-mono-latin.woff2" rel="preload" type="font/woff2" />
    <title>Analytics — Adrien Lacourpaille's sites</title>
    <meta
      content="Page views and visits on Adrien Lacourpaille's sites, counted without a cookie, an IP address or anything else that could tell two visitors apart."
      name="description"
    />
    <!--
      A layer's position is fixed where its name first appears, and Vite injects
      stylesheets in module-graph order: declared here, the order cannot depend
      on which component happened to be imported first.
    -->
    <style>
      @layer reset, tokens, base, components;
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
